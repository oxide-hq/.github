name: Feature request
description: Propose a new feature or an API change.
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what makes it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: How would it look in user code? If it mirrors a Laravel feature, link it.
      render: rust
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: breaking
    attributes:
      label: Compatibility
      options:
        - label: This would be a breaking change
